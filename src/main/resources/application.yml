spring:
  application:
    name: friendly-eats
  threads:
    virtual:
      enabled: true

  # Sessão opaca no Valkey (RF4). Ocioso 60 min (TTL deslizante); absoluto 24 h em
  # friendly-eats.security.session-absolute-timeout. "indexed" permite listar e encerrar sessões por usuário.
  session:
    timeout: 60m
    data:
      redis:
        repository-type: indexed
        namespace: fe:session
        # ElastiCache/Valkey gerenciado bloqueia CONFIG: em produção use "none" e ligue
        # notify-keyspace-events Egx no grupo de parâmetros.
        configure-action: ${SESSION_REDIS_CONFIGURE_ACTION:notify-keyspace-events}

  # PostgreSQL 17 + PostGIS · fonte da verdade
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/friendly_eats}
    username: ${POSTGRES_USER:friendly}
    password: ${POSTGRES_PASSWORD:friendly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # preserva nomes explícitos (ex.: tabela user_account com maiúsculas)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    locations: classpath:db/migration
    # schema.sql = V1 + V2 + ... concatenados (verificado por SchemaConsistencyTest)
  sql:
    init:
      mode: never   # o schema é aplicado pelo Flyway, nunca pelo sql init

  data:
    # Valkey (compatível com Redis) · cache L1, sessões e Trending Score
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}

  # Cassandra · timeline / logs / notificações
  cassandra:
    keyspace-name: friendly_eats
    contact-points: ${CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none

server:
  servlet:
    session:
      cookie:
        # Sem max-age: cookie de sessão, morre ao fechar o navegador; aba anônima tem cookies próprios.
        # __Host- exige Secure, Path=/ e nenhum Domain (o perfil dev usa nome simples sobre http).
        name: ${SESSION_COOKIE_NAME:__Host-fe_session}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

friendly-eats:
  # base dos links compartilhados (RF12): {public-base-url}/p/{postId}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  security:
    # Base64, 32+ bytes, vindo do Secrets Manager/Vault. Obrigatório fora dos perfis dev/it (AppSecrets).
    app-secret: ${FRIENDLY_EATS_APP_SECRET:}
    session-absolute-timeout: 24h
  legal:
    # Termos de Uso do Friendly Eats (docs/legal/TERMOS_DE_USO.md); mudar a versão pede novo aceite
    terms-version: "2026-10-25.1"
    terms-url: ${TERMS_URL:http://localhost:3000/termos}
    privacy-version: "2026-10-25"
  # escala nacional de preço por pessoa (RF6): limites = referência × multiplicadores, arredondados para R$ 5
  # (R$ 58 → até 40, 40–80, 80–160, acima de 160). Reajuste anual pelo IPCA de alimentação fora do domicílio.
  price:
    reference-brl: 58
    multipliers: 0.7,1.4,2.8
    round-brl: 5
    min-reports: 5             # relatos de gasto em 12 meses para a faixa vir das avaliações
  # nota agregada (RF8): média exibida a partir de 5 avaliações; ranking bayesiano com m = 10 e C = prior-mean
  rating:
    min-display: 5
    prior-weight: 10
    prior-mean: 4.2
    half-life-days: 365
    recency-floor: 0.25
  registration:
    minimum-age: 13
    protected-until-age: 16      # ECA Digital: padrões protetivos travados abaixo desta idade
  account:
    deletion-grace: 30d          # RF5: prazo para reativar antes da eliminação
    deletion-cron: "0 15 3 * * *"
  notifications:
    log-codes: false             # true só no perfil dev
  # moderação (RF13): limites e prazos são metas da casa, a confirmar com o jurídico
  moderation:
    bootstrap-moderators: ${MODERATOR_EMAILS:}   # e-mails separados por vírgula; recebem MODERATOR na subida
    reports-per-hour: 10         # denúncias por conta
    reports-per-day: 50
    public-reports-per-hour: 5   # formulário sem conta, por origem (HMAC do IP)
    appeal-days: 30              # prazo para recorrer (ECA Digital, art. 30)
    appeal-response-days: 7      # meta de resposta do recurso
    owner-contests-per-month: 10 # contestações de avaliação por lugar
    low-trust:                   # denunciante com muitas improcedentes desce um nível na fila
      min-dismissed: 3
      ratio: 0.7
      window-days: 90
  # integridade das avaliações (RF13): sinais de fraude e congelamento
  integrity:
    new-account-days: 7          # conta "nova"
    burst-window-hours: 24
    burst-threshold: 3           # avaliações de contas novas no mesmo lugar na janela: vão para análise
    freeze-threshold: 5          # a partir daqui, novas avaliações do lugar ficam congeladas
    freeze-days: 7
    same-origin-days: 30
  storage:
    # API S3: AWS S3 (sa-east-1) em produção, Garage em desenvolvimento
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    # endereço que vai nas URLs pré-assinadas (o celular precisa alcançar; o app pode usar a rede interna)
    presign-endpoint: ${S3_PRESIGN_ENDPOINT:${friendly-eats.storage.endpoint}}
    region: ${S3_REGION:sa-east-1}
    bucket: ${S3_BUCKET:friendly-eats-media}
    # privado: originais enviados pelo app (uploads/, com EXIF/GPS) e exportações do titular (exports/), nunca públicos
    uploads-bucket: ${S3_UPLOADS_BUCKET:friendly-eats-uploads}
    # vazio = cadeia padrão da AWS (papel da instância, AWS_ACCESS_KEY_ID...); nada de segredo aqui
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # de onde o app baixa mídias e avatares (CDN em produção; em dev, a leitura pública do Garage na :3902)
    public-url: ${S3_PUBLIC_URL:http://friendly-eats-media.web.garage.localhost:3902}
