# Perfil de desenvolvimento local: mvn spring-boot:run (o plugin ativa "dev")
# Segredo efêmero (AppSecrets), cookie sem __Host-/Secure para funcionar em http://localhost
# e o código de verificação de e-mail aparece no log.
# O Cassandra ainda não é usado pelo código (timeline e notificações vêm com RF9/RF12), então o perfil dev sobe
# só com `docker compose up -d`. Com `docker compose --profile full up -d`, rode com CASSANDRA_DEV_EXCLUDE= (vazio).
# Dados de exemplo (DevSeed) entram com o banco vazio.
spring:
  autoconfigure:
    exclude: ${CASSANDRA_DEV_EXCLUDE:org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration,org.springframework.boot.cassandra.autoconfigure.health.CassandraHealthContributorAutoConfiguration,org.springframework.boot.cassandra.autoconfigure.health.CassandraReactiveHealthContributorAutoConfiguration,org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration,org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration,org.springframework.boot.data.cassandra.autoconfigure.DataCassandraRepositoriesAutoConfiguration,org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveRepositoriesAutoConfiguration}

server:
  servlet:
    session:
      cookie:
        name: fe_session
        secure: false

friendly-eats:
  notifications:
    log-codes: true
  legal:
    controller-name: Friendly Eats (ambiente de desenvolvimento)
    dpo-name: Encarregado de Exemplo
    dpo-email: privacidade@friendlyeats.dev
    privacy-email: privacidade@friendlyeats.dev
  age-verification:
    reviewers: ana@friendlyeats.dev   # só no dev: a Ana revisa as contestações de idade
  storage:
    # chave pública do Garage local (criada por infra/garage/init.sh); só vale na sua máquina
    access-key: ${S3_ACCESS_KEY:GK667269656e646c7965617473}
    secret-key: ${S3_SECRET_KEY:667269656e646c792d656174732d6465762d6f6e6c7900000000000000000000}
